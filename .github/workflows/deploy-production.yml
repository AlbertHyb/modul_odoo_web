name: Deploy Financa production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financa-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: ./deploy/ci/validate_financa_staging.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure restricted SSH
        run: |
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_PORT"
          test -n "$PRODUCTION_SSH_USER"
          test -n "$PRODUCTION_DOMAIN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy the approved master commit
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PRODUCTION_SSH_PORT" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "deploy $GITHUB_SHA"
      - name: Verify the public endpoint
        run: curl -fsS --max-time 10 -o /dev/null "$PRODUCTION_DOMAIN/web/login"
