name: Deploy Financa staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financa-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: ./deploy/ci/validate_financa_staging.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure restricted SSH
        run: |
          test -n "$STAGING_SSH_HOST"
          test -n "$STAGING_SSH_PORT"
          test -n "$STAGING_SSH_USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy the pushed staging commit
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$STAGING_SSH_PORT" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "deploy $GITHUB_SHA"
