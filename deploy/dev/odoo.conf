# Odoo de desarrollo local/VPS. Sin secretos: la base solo es accesible dentro de la red de Compose.
[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = financa_dev
dbfilter = ^financa_dev$
list_db = False
workers = 0
max_cron_threads = 1
# Correo bloqueado: los correos se generan y quedan en Ajustes > Técnico > Correos, sin salir.
smtp_server = 127.0.0.1
smtp_port = 9
smtp_ssl = False
